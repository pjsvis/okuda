# bunfig.toml — the test runner's scope.
#
# `tmp/` is the scratch tier (`.gitignore:28`): regenerated by `just
# moira-pick`, never registered, zero tracked files. Bun's default test
# glob walks it anyway, so `bun test` loaded 28 files where the silo has
# 17 — 11 of them from a scratch checkout of an unrelated project, and one
# of those is a load-dependent timing test that fails only under full-suite
# load. `just test` was therefore red by 1, and the red was neither the
# silo's nor deterministic. Measured 2026-09-21.
#
# Scope the walker, not the call site: this fixes every invocation,
# including a bare `bun test`. See ADR-TEST-SCOPED-042.

[test]
pathIgnorePatterns = ["tmp/**"]
